[package]
name = "rustypod"
version = "0.1.0"
edition = "2021"
description = "Incremental Rust port of iPod Classic 6G retailOS (S5L8702, ARMv5TE)"

[lib]
crate-type = ["staticlib"]

[profile.release]
opt-level = 2
debug = false
lto = false
codegen-units = 1
panic = "abort"

# The crate is no_std, so an unwinding panic has nothing to unwind through.
# Without this, `cargo build --target <host>` fails with "unwinding panics are
# not supported without std" — the release profile already set it, the dev
# profile did not. Cargo ignores the setting for the test profile, so the host
# test suite is unaffected.
[profile.dev]
panic = "abort"

[dev-dependencies]
parking_lot = "0.12"

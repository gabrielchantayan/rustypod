# names.yaml — knowledge base for the retailOS Rust port.
#
# Maps osos load addresses to semantic names, signatures, variable renames
# and notes. Addresses are load addresses (base 0x08000000); file offset in
# osos.dec = address - 0x08000000. Sizes from Ghidra (decomp/functions.csv)
# unless noted.
#
# status values: identified / ported
# "ported" means: Rust port exists in src/, behavioral tests vs a reference
# implementation pass on host (cargo test), and a match.py mnemonic diff
# report was reviewed (exact instruction matches are not expected:
# ARM ADS 1.0.1 vs modern LLVM).

base: 0x08000000

functions:
  # --- ARM ADS runtime: memory block ---
  - address: 0x080000d4
    ghidra: FUN_080000d4
    name: memmove
    size: 452
    sig: "void *memmove(void *dst, const void *src, size_t len)"
    module: libc
    status: ported
    vars: {param_1: dst, param_2: src, param_3: len}
    notes: Backward copy on overlap from above, 32-byte block fast paths,
      funnel shifts for misaligned src.

  - address: 0x08000188
    ghidra: FUN_08000188
    name: memcpy
    size: 108
    sig: "void *memcpy(void *dst, const void *src, size_t len)"
    module: memcpy
    status: ported
    vars: {param_1: dst, param_2: src, param_3: len}
    notes: Forward word copy (32/16/8/4-byte blocks + tail). Assumes
      word-aligned pointers; memmove's aligned fast path as its own entry.
      Original advances and returns the end pointer; port returns dst.

  - address: 0x0800027c
    ghidra: FUN_0800027c
    name: memzero_aligned
    size: 88
    sig: "void *memzero_aligned(void *dst, size_t len)"
    module: memzero
    status: ported
    vars: {param_1: dst, param_2: len}
    notes: Zero-fill block loop, entry expects aligned dst.

  - address: 0x080002d4
    ghidra: FUN_080002d4
    name: memzero
    size: 68
    sig: "void *memzero(void *dst, size_t len)"
    module: memzero
    status: ported
    vars: {param_1: dst, param_2: len}
    notes: Zero-fill with len<4 + misalignment prologue, then shared block loop.

  - address: 0x08030fe4
    ghidra: FUN_08030fe4
    name: memset
    size: 20
    sig: "void *memset(void *dst, int value, size_t len)"
    module: memzero
    status: ported
    notes: Broadcasts value byte to a word, tail-branches into the shared
      fill body (via an iRAM veneer to memzero+4). Original is ADS
      __rt_memset(dst, len, value); port uses classic memset arg order.

  # --- ARM ADS runtime: string block @ 0x08030f64-0x080312a0 ---
  - address: 0x08030f64
    ghidra: FUN_08030f64
    name: memcmp
    size: 128
    sig: "int memcmp(const void *a, const void *b, size_t len)"
    module: memcmp
    status: ported
    notes: Word-at-a-time compare when aligned (re-scan mismatching word
      byte-wise), byte tail; returns u8 difference.

  - address: 0x08030ff4
    ghidra: FUN_08030ff4
    name: strcpy
    size: 100
    sig: "char *strcpy(char *dst, const char *src)"
    module: strcpy
    status: ported
    notes: ADS __strcpy_arm. Word-at-a-time with 0x01010101 zero-byte-detect
      idiom when aligned; 2x-unrolled byte loop otherwise. 116 call sites.

  - address: 0x0803105c
    ghidra: FUN_0803105c
    name: strncmp
    size: 116
    sig: "int strncmp(const char *a, const char *b, size_t len)"
    module: strncmp
    status: ported
    notes: Word compare + in-word NUL detect (0x01010101 idiom); byte tail
      with ADS `cmp b,#1; cmpcs` idiom. 67 call sites. No standalone strcmp
      exists in retailOS — it always uses strncmp.

  - address: 0x080310d4
    ghidra: FUN_080310d4
    name: strncpy
    size: 104
    sig: "char *strncpy(char *dst, const char *src, size_t len)"
    module: strncpy
    status: ported
    notes: Word copy + NUL idiom, then zero-pads to len (tail-calls zero
      filler). 41 call sites.

  - address: 0x08031140
    ghidra: FUN_08031140
    name: __rt_uread4
    size: 32
    sig: "u32 __rt_uread4(const void *p)"
    module: rt_unaligned
    status: ported
    notes: Byte-wise little-endian unaligned u32 load (read_unaligned today).

  - address: 0x08031160
    ghidra: FUN_08031160
    name: __rt_uwrite4
    size: 32
    sig: "u32 __rt_uwrite4(void *p, u32 value)"
    module: rt_unaligned
    status: ported
    notes: Byte-wise LE unaligned u32 store. Original arg order (value, p).

  - address: 0x08031180
    ghidra: FUN_08031180
    name: memchr
    size: 52
    sig: "const void *memchr(const void *s, int c, size_t len)"
    module: memchr
    status: ported
    notes: Bounded byte scan for (c as u8).

  - address: 0x080311b4
    ghidra: FUN_080311b4
    name: strcat
    size: 40
    sig: "char *strcat(char *dst, const char *src)"
    module: strcat
    status: ported

  - address: 0x080311dc
    ghidra: FUN_080311dc
    name: strchr
    size: 36
    sig: "const char *strchr(const char *s, int c)"
    module: strchr
    status: ported
    notes: Match test before NUL test, so c=='\0' returns the terminator.

  - address: 0x08031200
    ghidra: FUN_08031200
    name: strncat
    size: 64
    sig: "char *strncat(char *dst, const char *src, size_t len)"
    module: strcat
    status: ported

  - address: 0x08031240
    ghidra: FUN_08031240
    name: strrchr
    size: 36
    sig: "const char *strrchr(const char *s, int c)"
    module: strchr
    status: ported
    notes: Full-string scan keeping last match.

  - address: 0x08031264
    ghidra: FUN_08031264
    name: strstr
    size: 60
    sig: "const char *strstr(const char *haystack, const char *needle)"
    module: strstr
    status: ported
    notes: Byte-at-a-time brute force; empty needle returns haystack.

  # --- retailOS safe helpers ---
  - address: 0x082770bc
    ghidra: FUN_082770bc
    name: strlen_safe
    size: 36
    sig: "size_t strlen_safe(const char *s)"
    module: strlen_safe
    status: ported
    notes: NULL-guarded strlen (returns 0 for null). Classic ADS strlen is
      genuinely absent from the binary; this is what retailOS uses.
      Variants: 0x0810b610 (identical), 0x08275e20 (count+1).

  # --- Batch 2: ARM ADS arithmetic / stdlib runtime ---
  - address: 0x08031568
    ghidra: FUN_08031568
    name: __rt_sdiv
    size: 356
    sig: "i32 __rt_sdiv(i32 num, i32 den)  // rem also in r1"
    module: rt_div
    status: ported
    notes: 1812 call sites. Unrolled restoring division + sign fix.
      Truncation semantics; div0 raises via __rt_raise (stubbed).

  - address: 0x08036f14
    ghidra: FUN_08036f14
    name: __rt_udiv
    size: 28
    sig: "u32 __rt_udiv(u32 num, u32 den)"
    module: rt_div
    status: ported
    notes: 487 call sites; joins the sdiv core mid-stream skipping sign handling.

  - address: 0x0803421c
    name: __rt_div0
    size: 12
    module: rt_div
    status: identified
    notes: mov r0,#2; mov r1,#2; b __rt_raise(0x080320a8).

  - address: 0x0802eefc
    ghidra: FUN_0802eefc
    name: __aeabi_uldivmod
    size: 712
    sig: "u64 __aeabi_uldivmod(u64 num, u64 den)  // rem in r2:r3"
    module: aeabi_64div
    status: ported
    notes: clz-normalized shifting restore; 53 callers.

  - address: 0x0802ee34
    ghidra: FUN_0802ee34
    name: __aeabi_ldivmod
    size: 80
    sig: "i64 __aeabi_ldivmod(i64 num, i64 den)"
    module: aeabi_64div
    status: ported
    notes: Signed wrapper over the unsigned core; 52 callers.

  - address: 0x0802ee84
    ghidra: FUN_0802ee84
    name: __aeabi_llsl
    size: 40
    sig: "u64 __aeabi_llsl(u64 v, u32 shift)"
    module: aeabi_64shift
    status: ported

  - address: 0x0802eeac
    ghidra: FUN_0802eeac
    name: __aeabi_llsr
    size: 40
    sig: "u64 __aeabi_llsr(u64 v, u32 shift)"
    module: aeabi_64shift
    status: ported

  - address: 0x0802eed4
    ghidra: FUN_0802eed4
    name: __aeabi_lasr
    size: 40
    sig: "i64 __aeabi_lasr(i64 v, u32 shift)"
    module: aeabi_64shift
    status: ported

  - address: 0x080320d0
    ghidra: FUN_080320d0
    name: _ll_udiv10
    size: 152
    sig: "u64 _ll_udiv10(u64 num)  // rem in r2"
    module: ll_udiv10
    status: ported
    notes: Shift-add magic multiply by 10; callers: dtoa, %lld, strtoull.

  - address: 0x08030e7c
    ghidra: FUN_08030e7c
    name: srandom
    size: 68
    sig: "void srandom(u32 seed)"
    module: random
    status: ported
    notes: Seeds 55-word table @ 0x08b2f918 (LCG *69069 + 0x66d619e1,
      store seed+(seed>>16)); lag indices @ 0x08a0fb94 = 23/54.

  - address: 0x08030ec8
    ghidra: FUN_08030ec8
    name: random
    size: 84
    sig: "i32 random()"
    module: random
    status: ported
    notes: Additive lagged Fibonacci; result & 0x7fffffff.

  - address: 0x08030ec0
    name: srandom1_thunk
    size: 8
    module: random
    status: ported
    notes: srandom(1) tail call.

  - address: 0x0802f1bc
    ghidra: FUN_0802f1bc
    name: tolower
    size: 36
    sig: "i32 tolower(i32 c)"
    module: ctype
    status: ported
    notes: ctype table @ 0x08985f01 (EOF guard byte at -1); bit 0x10 =
      uppercase (adds 0x20). Table embedded in ctype.rs as CTYPE_TABLE.

  - address: 0x0802f1e0
    ghidra: FUN_0802f1e0
    name: toupper
    size: 40
    sig: "i32 toupper(i32 c)"
    module: ctype
    status: ported
    notes: bit 0x08 = lowercase (subtracts 0x20); 0xdf guard (dead under C locale).

  - address: 0x08032fec
    ghidra: FUN_08032fec
    name: _chval
    size: 32
    sig: "i32 _chval(u8 c, u32 base)"
    module: chval
    status: ported
    notes: ASCII to digit, -1 if invalid for base.

  - address: 0x08030e60
    ghidra: FUN_08030e60
    name: ldiv
    size: 28
    sig: "ldiv_t ldiv(i32 num, i32 den)"
    module: chval
    status: ported
    notes: Tail-calls __rt_sdiv, stores {quot, rem} via hidden ptr.

  - address: 0x08033088
    ghidra: FUN_08033088
    name: strtoul
    size: 232
    sig: "u32 strtoul(const char *s, char **endptr, int base)"
    module: strtoul
    status: ported
    notes: Conversion core merged with ws/sign wrapper @ 0x0802f87c.
      ADS quirk: "0x" with no hex digit = no conversion. errno skipped.

  - address: 0x0802f87c
    ghidra: FUN_0802f87c
    name: strtol
    size: 176
    sig: "i32 strtol(const char *s, char **endptr, int base)"
    module: strtol
    status: ported
    notes: Clamps i32::MAX/MIN (port follows ADS wrapper contract;
      literal core wraps). errno skipped.

  - address: 0x0802f990
    ghidra: FUN_0802f990
    name: atoi
    size: 52
    sig: "i32 atoi(const char *s)"
    module: strtol
    status: ported

  - address: 0x0802fba0
    ghidra: FUN_0802fba0
    name: atol
    size: 52
    sig: "i32 atol(const char *s)"
    module: strtol
    status: ported

  - address: 0x08034e68
    ghidra: FUN_08034e68
    name: __strtoull
    size: 288
    sig: "u64 __strtoull(const char *s, char **endptr, int base)"
    module: strtoull
    status: ported
    notes: 16/32/16-bit split accumulation (umull only). No standalone
      strtoull wrapper exists; port reconstructs it from strtoll prologue.

  - address: 0x080332d0
    ghidra: FUN_080332d0
    name: strtoll
    size: 248
    module: strtoull
    status: identified
    notes: Signed wrapper calling __strtoull; not yet ported.

  - address: 0x08031720
    ghidra: FUN_08031720
    name: setjmp
    size: 40
    sig: "i32 setjmp(JmpBuf *env)"
    module: setjmp
    status: ported
    notes: EXACT MATCH (instruction-for-instruction). Saves r4-r11,sp,lr
      in non-ascending order + unwinder self-ref slot.

  - address: 0x08031748
    ghidra: FUN_08031748
    name: longjmp
    size: 44
    sig: "void longjmp(const JmpBuf *env, i32 val)"
    module: setjmp
    status: ported
    notes: 10/11 instructions match (bl via relocation). val==0 -> 1.

  - address: 0x080336cc
    ghidra: FUN_080336cc
    name: stack_switch
    size: 12
    module: setjmp
    status: ported
    notes: EXACT MATCH. push {r0,r1}; ldm sp,{sl,sp}; mov pc,lr.

  - address: 0x08000020
    name: __rt_memcpy
    size: 180
    sig: "void *__rt_memcpy(void *dst, const void *src, size_t len)"
    module: rt_memcpy
    status: ported
    notes: THE hottest function (~620 call sites via veneer 0x08037db0).
      dst-align prologue, funnel shifts for misaligned src, tail-branches
      to the shared block body @ 0x08000188. Not in functions.csv.

  # --- Corrections / discoveries from batch 2 ---
  - address: 0x08030998
    ghidra: FUN_08030998
    name: qsort_inner
    size: 828
    status: identified
    notes: Insertion sort / median-of-three quicksort with explicit
      recursion stack. Previously misidentified as __strtoull.

  - address: 0x08030cd4
    ghidra: FUN_08030cd4
    name: qsort
    size: 256
    status: identified
    notes: Public qsort; 7 callers. Previously misidentified as strtoull.

  - address: 0x08985f01
    name: ctype_table
    size: 256
    status: identified
    notes: C-locale ctype flags table (+0x10 uppercase, +0x08 lowercase);
      EOF guard byte at 0x08985f00. Embedded in ctype.rs.

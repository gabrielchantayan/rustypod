      byte 0x00 at 0x08985f00. CTYPE_TABLE in runtime/ctype.rs verified
      byte-exact against osos.dec (file offset 0x985f01). No literal-pool
      pointer to it exists anywhere in the image — the address is computed
      at runtime by the locale init (LC_CTYPE block header @ 0x08985ef4,
      size 0x110, name "C") and installed at libspace+0x24, whence
      tolower/toupper/wcrtomb and the scanf ctype hook load it.


      with `movcc/addcs` on an address (a min, transcribed as such); on
      a tie the shorter string wins. The original computes the full
      three-way result and then keeps only its sign bit
      (`lsr r0,r0,#31`), so the return is 0 or 1. Length-driven, so
      embedded NULs order correctly. `this` (r0) is overwritten by the
      first load.


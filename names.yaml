      does `if (empty()) construct`), but whether the word at +0x20 is
      a count or a head pointer is NOT pinned down, so the class is not
      identified and the name is provisional - it says what callers use
      the answer for, which is all the firmware tells us. The port
      reads the field by word index (8); match.py - LLVM normalizes the

      u64 division whenever hi < divisor - it does NOT. The remainder is
      one 32-bit register, so r <<= 1 drops its top bit. That is
      harmless exactly while divisor <= 0x80000000 (then r <= divisor-1
      <= 0x7fffffff and 2r+1 still fits), and diverges above it -
      ft_div64by32(0x90000000, 0, 0xffffffff) is 0 where the true
      quotient is 0x90000000 (pinned by a test). Both callers divide by
      an i32 magnitude and so stay inside the safe range, which is why
      the previous inlined u64 stand-in in ft_divfix/ft_muldiv was
